name: Run API tests

permissions:
  contents: read
  id-token: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run API tests
        run: npx playwright test

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure_results
          path: allure-results/

  generate-and-publish-report:
    runs-on: ubuntu-latest
    needs: run-api-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure_results
          path: allure-results/

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          curl -o allure-2.21.0.zip -L https://github.com/allure-framework/allure2/releases/download/2.21.0/allure-2.21.0.zip
          unzip allure-2.21.0.zip
          echo "::add-path::${PWD}/allure-2.21.0/bin"

      - name: Generate Allure report
        run: allure generate allure-results -o _site --clean

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
