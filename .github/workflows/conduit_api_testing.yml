name: Conduit API Testing

on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

permissions:
 contents: read
 pages: write
 id-token: write

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API tests
        run: npx playwright test --project=api

      - name: Upload allure-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  generate-and-publish-report:
    runs-on: ubuntu-latest
    needs: run-api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download allure-results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz -O /tmp/allure.tgz
          sudo tar -zxvf /tmp/allure.tgz -C /opt/
          sudo ln -s /opt/allure-2.34.1/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: allure generate allure-results --clean -o _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
